[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masscan-monitor"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "aiosqlite",
    "aiosmtplib",
    "apscheduler",
    "pydantic",
    "jinja2",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"